<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopKart – Seller Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;--white:#ffffff;--surface:#f0f2f8;
  --blue:#2563eb;--blue-light:#eff6ff;--blue-mid:#bfdbfe;
  --indigo:#4f46e5;
  --yellow:#f59e0b;--yellow-light:#fffbeb;--yellow-mid:#fde68a;
  --orange:#ea580c;--orange-light:#fff7ed;--orange-mid:#fed7aa;
  --green:#16a34a;--green-light:#f0fdf4;--green-mid:#bbf7d0;
  --teal:#0d9488;--teal-light:#f0fdfa;
  --red:#dc2626;--red-light:#fef2f2;--red-mid:#fecaca;
  --purple:#7c3aed;--purple-light:#faf5ff;--purple-mid:#ddd6fe;
  --gray:#64748b;--gray-light:#f8fafc;--border:#e2e8f0;
  --text:#0f172a;--sub:#64748b;--sub2:#94a3b8;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
  --font-h:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;--font-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;}

/* ── TOPBAR ── */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
.tb-left{display:flex;align-items:center;gap:16px;}
.logo{font-family:var(--font-h);font-size:20px;font-weight:800;color:var(--text);}
.logo em{color:var(--blue);font-style:normal;}
.seller-badge{background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--blue-mid);}
.tb-right{display:flex;align-items:center;gap:12px;}
.tb-btn{padding:7px 16px;border-radius:8px;font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:flex;align-items:center;gap:6px;}
.tb-btn-ghost{background:none;color:var(--sub);border:1px solid var(--border);}
.tb-btn-ghost:hover{background:var(--surface);border-color:var(--sub2);}
.tb-btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3);}
.tb-btn-primary:hover{background:#1d4ed8;transform:translateY(-1px);}
.db-status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);}
.db-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.db-dot.connecting{background:var(--yellow);animation:blink 1s infinite;}
.db-dot.error{background:var(--red);animation:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── LAYOUT ── */
.layout{display:flex;}
.sidebar{width:220px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);min-height:calc(100vh - 60px);padding:20px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
.main{flex:1;padding:28px;overflow:auto;}

/* ── SIDEBAR ── */
.nav-section{padding:0 14px;margin-bottom:4px;}
.nav-label{font-size:10px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:1px;padding:10px 8px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px;font-weight:600;transition:all .2s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--blue-light);color:var(--blue);}
.nav-item .ni{font-size:16px;width:20px;text-align:center;}
.nav-item .nbadge{margin-left:auto;background:var(--blue);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.nav-item.active .nbadge{background:var(--blue);color:#fff;}
.nav-sep{height:1px;background:var(--border);margin:10px 14px;}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:all .25s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-card.active-filter{box-shadow:0 0 0 2px var(--blue);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;}
.stat-card.blue::before{background:var(--blue);}
.stat-card.yellow::before{background:var(--yellow);}
.stat-card.orange::before{background:var(--orange);}
.stat-card.green::before{background:var(--green);}
.stat-card.red::before{background:var(--red);}
.stat-card.purple::before{background:var(--purple);}
.sc-icon{font-size:24px;margin-bottom:8px;}
.sc-val{font-family:var(--font-h);font-size:26px;font-weight:800;margin-bottom:2px;}
.sc-label{font-size:11px;color:var(--sub);font-weight:600;}
.sc-change{font-size:11px;margin-top:4px;}
.sc-change.up{color:var(--green);}
.sc-change.down{color:var(--red);}

/* ── FILTERS & SEARCH ── */
.controls{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 14px;flex:1;min-width:200px;transition:border .2s;}
.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.search-box input{border:none;outline:none;font-family:var(--font-b);font-size:14px;color:var(--text);background:transparent;width:100%;}
.search-box input::placeholder{color:var(--sub2);}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.ftab{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--sub);transition:all .2s;display:flex;align-items:center;gap:5px;}
.ftab:hover{border-color:var(--sub2);color:var(--text);}
.ftab.active{color:#fff;border-color:transparent;}
.ftab.all.active{background:var(--text);}
.ftab.confirmed.active{background:var(--blue);}
.ftab.processing.active{background:var(--yellow);color:var(--text);}
.ftab.packed.active{background:var(--orange);}
.ftab.shipped.active{background:var(--teal);}
.ftab.delivered.active{background:var(--green);}
.ftab.cancelled.active{background:var(--red);}
.tab-count{background:rgba(255,255,255,.3);font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center;}
.ftab.all.active .tab-count,.ftab.processing.active .tab-count{background:rgba(0,0,0,.12);color:inherit;}

/* ── SORT & VIEW TOGGLE ── */
.sort-sel{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:var(--font-b);font-size:13px;color:var(--text);outline:none;cursor:pointer;}
.view-toggle{display:flex;background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.vt-btn{padding:8px 12px;border:none;background:none;cursor:pointer;font-size:16px;transition:background .2s;color:var(--sub);}
.vt-btn:hover,.vt-btn.active{background:var(--blue-light);color:var(--blue);}

/* ── KANBAN ── */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.kb-col{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.kb-col-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.kb-col-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
.kb-col-count{font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;}
.kb-body{padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;}
.kb-card{background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:11px 12px;cursor:pointer;transition:all .22s;animation:cardIn .3s ease both;}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kb-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.kb-card-id{font-family:var(--font-m);font-size:10px;font-weight:600;color:var(--sub2);margin-bottom:5px;}
.kb-card-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
.kb-card-meta{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kb-card-price{font-size:13px;font-weight:800;margin-top:6px;}
.kb-empty{text-align:center;padding:20px;color:var(--sub2);font-size:12px;}

/* ── COLUMN COLORS ── */
.kb-col.confirmed .kb-col-head{background:var(--blue-light);}
.kb-col.confirmed .kb-col-title{color:var(--blue);}
.kb-col.confirmed .kb-col-count{background:var(--blue);color:#fff;}
.kb-col.processing .kb-col-head{background:var(--yellow-light);}
.kb-col.processing .kb-col-title{color:var(--yellow);}
.kb-col.processing .kb-col-count{background:var(--yellow);color:#fff;}
.kb-col.packed .kb-col-head{background:var(--orange-light);}
.kb-col.packed .kb-col-title{color:var(--orange);}
.kb-col.packed .kb-col-count{background:var(--orange);color:#fff;}
.kb-col.shipped .kb-col-head{background:var(--teal-light);}
.kb-col.shipped .kb-col-title{color:var(--teal);}
.kb-col.shipped .kb-col-count{background:var(--teal);color:#fff;}
.kb-col.delivered .kb-col-head{background:var(--green-light);}
.kb-col.delivered .kb-col-title{color:var(--green);}
.kb-col.delivered .kb-col-count{background:var(--green);color:#fff;}
.kb-card.confirmed{border-left:3px solid var(--blue);}
.kb-card.processing{border-left:3px solid var(--yellow);}
.kb-card.packed{border-left:3px solid var(--orange);}
.kb-card.shipped{border-left:3px solid var(--teal);}
.kb-card.delivered{border-left:3px solid var(--green);}
.kb-card.cancelled{border-left:3px solid var(--red);}

/* ── TABLE VIEW ── */
.orders-table-wrap{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.ot-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--gray-light);}
.ot-head-title{font-family:var(--font-h);font-size:16px;font-weight:700;}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--gray-light);padding:11px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--blue-light);}
td{padding:13px 16px;font-size:13px;vertical-align:middle;}
.td-id{font-family:var(--font-m);font-size:11px;color:var(--sub);}
.td-name{font-weight:600;}
.td-sub{font-size:12px;color:var(--sub);}

/* ── STATUS PILLS ── */
.spill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;}
.spill.confirmed{background:var(--blue-light);color:var(--blue);}
.spill.processing{background:var(--yellow-light);color:#92400e;}
.spill.packed{background:var(--orange-light);color:var(--orange);}
.spill.shipped{background:var(--teal-light);color:var(--teal);}
.spill.delivered{background:var(--green-light);color:var(--green);}
.spill.cancelled{background:var(--red-light);color:var(--red);}
.spill.returned{background:var(--purple-light);color:var(--purple);}

/* ── ORDER DETAIL MODAL ── */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-mask.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--white);border-radius:20px;width:720px;max-width:96vw;max-height:94vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);transform:scale(.96) translateY(16px);transition:transform .36s cubic-bezier(.34,1.2,.64,1);}
.modal-mask.open .modal-box{transform:scale(1) translateY(0);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-head h2{font-family:var(--font-h);font-size:20px;font-weight:800;}
.modal-close{background:var(--surface);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--sub);transition:all .2s;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--border);color:var(--text);}
.modal-body{flex:1;overflow-y:auto;padding:24px;}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── STATUS WORKFLOW ── */
.workflow-title{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;}
.workflow{display:flex;align-items:center;gap:0;margin-bottom:28px;overflow-x:auto;padding-bottom:4px;}
.wf-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:80px;}
.wf-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid var(--border);background:var(--white);transition:all .3s;position:relative;z-index:1;flex-shrink:0;}
.wf-dot.done{background:var(--green);border-color:var(--green);color:#fff;}
.wf-dot.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.2);animation:activePulse 2s infinite;}
@keyframes activePulse{0%,100%{box-shadow:0 0 0 4px rgba(37,99,235,.2)}50%{box-shadow:0 0 0 8px rgba(37,99,235,.08)}}
.wf-dot.pending{background:var(--surface);color:var(--sub2);}
.wf-dot.cancelled{background:var(--red-light);border-color:var(--red);color:var(--red);}
.wf-label{font-size:10px;font-weight:700;text-align:center;color:var(--sub);line-height:1.2;}
.wf-label.done{color:var(--green);}
.wf-label.active{color:var(--blue);font-weight:800;}
.wf-connector{flex:1;height:2px;background:var(--border);margin-top:-24px;min-width:20px;}
.wf-connector.done{background:var(--green);}

/* ── STATUS CHANGE BUTTONS ── */
.status-actions{margin-bottom:24px;}
.sa-title{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sa-btns{display:flex;gap:10px;flex-wrap:wrap;}
.sa-btn{padding:11px 20px;border-radius:10px;font-family:var(--font-b);font-size:13px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .25s;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;}
.sa-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .2s;}
.sa-btn:hover::before{background:rgba(255,255,255,.15);}
.sa-btn:disabled{opacity:.35;cursor:not-allowed;}
.sa-btn:disabled::before{display:none;}
.sa-btn.processing{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 3px 10px rgba(245,158,11,.35);}
.sa-btn.packed{background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;box-shadow:0 3px 10px rgba(234,88,12,.35);}
.sa-btn.shipped{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;box-shadow:0 3px 10px rgba(13,148,136,.35);}
.sa-btn.delivered{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 3px 10px rgba(22,163,74,.35);}
.sa-btn.cancelled{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 3px 10px rgba(220,38,38,.35);}
.sa-btn.back{background:var(--surface);color:var(--sub);border-color:var(--border);}
.sa-btn.back:hover{background:var(--border);color:var(--text);}
.sa-btn .btn-ico{font-size:18px;}

/* courier input */
.courier-section{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px;}
.courier-section h4{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.inp-group{display:flex;flex-direction:column;gap:5px;}
.inp-group label{font-size:11px;font-weight:700;color:var(--sub);}
.inp-group input,.inp-group select{border:1.5px solid var(--border);border-radius:7px;padding:9px 12px;font-family:var(--font-b);font-size:13px;color:var(--text);outline:none;transition:border .2s;background:var(--white);}
.inp-group input:focus,.inp-group select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.courier-note{font-size:11px;color:var(--sub);margin-top:8px;}

/* ── ORDER INFO GRID ── */
.order-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.oi-card{background:var(--surface);border-radius:10px;padding:14px;}
.oi-title{font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.oi-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.oi-key{color:var(--sub);}
.oi-val{font-weight:600;text-align:right;}

/* order items in modal */
.modal-items{margin-bottom:20px;}
.mi-title{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.mi-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface);border-radius:8px;margin-bottom:8px;}
.mi-em{font-size:32px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--white);border-radius:8px;}
.mi-name{font-size:13px;font-weight:600;flex:1;}
.mi-qty{font-size:11px;color:var(--sub);margin-top:2px;}
.mi-price{font-size:14px;font-weight:800;}

/* ── HISTORY TIMELINE ── */
.history-title{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}
.history-line{display:flex;flex-direction:column;gap:0;}
.hs{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.hs:last-child{padding-bottom:0;}
.hs-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.hs-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.hs-dot.done{background:var(--green);}
.hs-dot.active{background:var(--blue);animation:activePulse2 2s infinite;}
@keyframes activePulse2{0%,100%{box-shadow:0 0 0 3px rgba(37,99,235,.2)}50%{box-shadow:0 0 0 6px rgba(37,99,235,.08)}}
.hs-dot.pending{background:var(--border);}
.hs-line{flex:1;width:2px;background:var(--border);margin:3px 0;}
.hs-line.done{background:var(--green);}
.hs-content h4{font-size:13px;font-weight:700;}
.hs-content p{font-size:12px;color:var(--sub);margin-top:2px;}
.hs-content .hs-time{font-size:10px;color:var(--sub2);margin-top:3px;font-family:var(--font-m);}
.hs-content .hs-actor{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:var(--blue-light);color:var(--blue);padding:2px 7px;border-radius:8px;margin-top:4px;font-weight:600;}

/* ── CONFIRM POPUP ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:600;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.confirm-overlay.open{opacity:1;pointer-events:all;}
.confirm-box{background:var(--white);border-radius:16px;padding:28px;width:400px;max-width:90vw;box-shadow:var(--shadow-lg);transform:scale(.94);transition:transform .25s cubic-bezier(.34,1.2,.64,1);}
.confirm-overlay.open .confirm-box{transform:scale(1);}
.conf-icon{font-size:44px;text-align:center;margin-bottom:14px;}
.conf-title{font-family:var(--font-h);font-size:19px;font-weight:800;text-align:center;margin-bottom:8px;}
.conf-msg{font-size:14px;color:var(--sub);text-align:center;line-height:1.6;margin-bottom:20px;}
.conf-btns{display:flex;gap:10px;}
.conf-yes{flex:1;padding:12px;border-radius:8px;border:none;font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.conf-no{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;color:var(--sub);transition:all .2s;}
.conf-no:hover{background:var(--surface);}

/* ── BULK ACTIONS ── */
.bulk-bar{background:var(--blue);color:#fff;border-radius:10px;padding:12px 18px;display:none;align-items:center;gap:14px;margin-bottom:16px;animation:slideDown .3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.bulk-bar.show{display:flex;}
.bulk-count{font-size:14px;font-weight:700;}
.bulk-btns{display:flex;gap:8px;margin-left:auto;}
.bulk-btn{padding:7px 14px;border-radius:6px;font-family:var(--font-b);font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .2s;background:rgba(255,255,255,.2);color:#fff;}
.bulk-btn:hover{background:rgba(255,255,255,.35);}
.bulk-btn.danger{background:rgba(220,38,38,.4);}
.bulk-btn.danger:hover{background:rgba(220,38,38,.7);}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;min-width:280px;background:var(--text);color:#fff;padding:14px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px) scale(.97);transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:9999;display:flex;align-items:center;gap:10px;}
.toast.show{opacity:1;transform:none;}
.toast-icon{font-size:20px;}
.toast-msg{flex:1;}
.toast-close{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:16px;padding:0 2px;}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
.empty-state .ei{font-size:60px;opacity:.3;margin-bottom:14px;}
.empty-state h3{font-family:var(--font-h);font-size:20px;margin-bottom:6px;color:var(--text);}

/* checkbox */
input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--blue);}

@media(max-width:1100px){.stats-row{grid-template-columns:repeat(3,1fr);}.kanban{grid-template-columns:repeat(3,1fr);}}
@media(max-width:768px){.sidebar{display:none;}.stats-row{grid-template-columns:repeat(2,1fr);}.kanban{grid-template-columns:1fr 1fr;}.order-info-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-left">
    <div class="logo">Shop<em>Kart</em></div>
    <div class="seller-badge">⚙️ Seller Dashboard</div>
  </div>
  <div class="tb-right">
    <div class="db-status"><div class="db-dot connecting" id="dbDot"></div><span id="dbLabel">Connecting to DB…</span></div>
    <button class="tb-btn tb-btn-ghost" onclick="refreshAll()">🔄 Refresh</button>
    <button class="tb-btn tb-btn-ghost" onclick="window.open('shopkart-db-viewer.html')">🗄 DB Viewer</button>
    <button class="tb-btn tb-btn-primary" onclick="showToast('success','📊 Report exported!','Sales report downloaded')">📊 Export Report</button>

<div class="layout">

  <!-- SIDEBAR -->

    <div class="nav-section">
      <div class="nav-label">Main</div>
      <button class="nav-item active" id="nav-orders" onclick="setNav('orders')"><span class="ni">📦</span>Orders<span class="nbadge" id="nb-orders">0</span></button>
      <button class="nav-item" id="nav-analytics" onclick="setNav('analytics')"><span class="ni">📈</span>Analytics</button>
      <button class="nav-item" id="nav-customers" onclick="setNav('customers')"><span class="ni">👥</span>Customers</button>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-section">
      <div class="nav-label">Order Queues</div>

      <button class="nav-item" onclick="filterByStatus('processing')"><span class="ni">🔄</span>Processing<span class="nbadge" id="nb-processing" style="background:var(--yellow);color:#111">0</span></button>
      <button class="nav-item" onclick="filterByStatus('packed')"><span class="ni">📦</span>Ready to Ship<span class="nbadge" id="nb-packed" style="background:var(--orange)">0</span></button>
      <button class="nav-item" onclick="filterByStatus('shipped')"><span class="ni">🚚</span>Shipped<span class="nbadge" id="nb-shipped" style="background:var(--teal)">0</span></button>
      <button class="nav-item" onclick="filterByStatus('delivered')"><span class="ni">✓</span>Delivered<span class="nbadge" id="nb-delivered" style="background:var(--green)">0</span></button>
      <button class="nav-item" onclick="filterByStatus('cancelled')"><span class="ni">❌</span>Cancelled<span class="nbadge" id="nb-cancelled" style="background:var(--red)">0</span></button>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-section">
      <div class="nav-label">Tools</div>
      <button class="nav-item" onclick="window.open('shopkart-db-viewer.html')"><span class="ni">🗄</span>DB Viewer</button>
      <button class="nav-item" onclick="window.open('shopkart-db.html')"><span class="ni">🛒</span>Open Store</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="mainArea">
    <div style="text-align:center;padding:80px;color:var(--sub)">
      <div style="font-size:48px;margin-bottom:12px;">⚡</div>
      <div style="font-family:var(--font-h);font-size:20px;">Connecting to ShopKartDB…</div>
    </div>
  </div>

</div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-mask" id="modalMask" onclick="handleMaskClick(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Order Details</h2>

<!-- CONFIRM POPUP -->

  <div class="confirm-box">

    <div class="conf-title" id="confTitle">Confirm Action</div>
    <div class="conf-msg" id="confMsg">Are you sure?</div>
    <div class="conf-btns">
      <button class="conf-yes" id="confYes" onclick="doConfirm()">Yes, Proceed</button>
      <button class="conf-no" onclick="closeConfirm()">Cancel</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toastEl">
  <span class="toast-icon" id="toastIcon">✅</span>
  <span class="toast-msg" id="toastMsg">Done!</span>
  <button class="toast-close" onclick="document.getElementById('toastEl').classList.remove('show')">✕</button>
</div>

<script>
'use strict';

// ════════════════════════════════════════════════
//  DB LAYER  (same ShopKartDB as main app)
// ════════════════════════════════════════════════
const DB_NAME='ShopKartDB', DB_VER=1;
let db=null;

function initDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('users')){const u=d.createObjectStore('users',{keyPath:'phone'});u.createIndex('phone','phone',{unique:true});}
      if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'key'});
      if(!d.objectStoreNames.contains('orders')){const o=d.createObjectStore('orders',{keyPath:'id'});o.createIndex('phone','phone',{unique:false});o.createIndex('createdAt','createdAt',{unique:false});}
      if(!d.objectStoreNames.contains('addresses')){const a=d.createObjectStore('addresses',{keyPath:'addrId'});a.createIndex('phone','phone',{unique:false});}
      if(!d.objectStoreNames.contains('cart')){const c=d.createObjectStore('cart',{keyPath:'cartKey'});c.createIndex('phone','phone',{unique:false});}
      if(!d.objectStoreNames.contains('wishlist')){const w=d.createObjectStore('wishlist',{keyPath:'wishKey'});w.createIndex('phone','phone',{unique:false});}
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=e=>rej(e.target.error);
  });
}
const dbGetAll=store=>new Promise((r,j)=>{const q=db.transaction(store,'readonly').objectStore(store).getAll();q.onsuccess=()=>r(q.result);q.onerror=j;});
const dbPut=(store,val)=>new Promise((r,j)=>{const q=db.transaction(store,'readwrite').objectStore(store).put(val);q.onsuccess=()=>r();q.onerror=j;});

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let allOrders=[], filteredOrders=[], selectedIds=new Set();
let currentFilter='all', currentSearch='', currentView='table';
let pendingAction=null, openOrderId=null;

// STATUS WORKFLOW  (linear pipeline + allowed transitions)
const STATUS_FLOW=['confirmed','processing','packed','shipped','delivered'];
const TRANSITIONS={
  confirmed:  [{s:'processing',label:'Start Processing',icon:'🔄',cls:'processing'},{s:'cancelled',label:'Cancel Order',icon:'❌',cls:'cancelled'}],
  processing: [{s:'packed',    label:'Mark as Packed',  icon:'📦',cls:'packed'},    {s:'cancelled',label:'Cancel Order',icon:'❌',cls:'cancelled'}],
  packed:     [{s:'shipped',   label:'Mark as Shipped', icon:'🚚',cls:'shipped'},   {s:'cancelled',label:'Cancel Order',icon:'❌',cls:'cancelled'}],
  shipped:    [{s:'delivered', label:'Mark as Delivered',icon:'✅',cls:'delivered'}],
  delivered:  [],
  cancelled:  [],
  returned:   [],
};
const STATUS_META={
  confirmed:  {label:'Order Confirmed', icon:'✅', color:'var(--blue)',   dot:'#2563eb'},
  processing: {label:'Processing',      icon:'🔄', color:'var(--yellow)', dot:'#f59e0b'},
  packed:     {label:'Packed & Ready',  icon:'📦', color:'var(--orange)', dot:'#ea580c'},
  shipped:    {label:'Shipped',         icon:'🚚', color:'var(--teal)',   dot:'#0d9488'},
  delivered:  {label:'Delivered',       icon:'🎉', color:'var(--green)',  dot:'#16a34a'},
  cancelled:  {label:'Cancelled',       icon:'❌', color:'var(--red)',    dot:'#dc2626'},
  returned:   {label:'Returned',        icon:'↩️', color:'var(--purple)', dot:'#7c3aed'},
};

const COURIER_OPTIONS=['Delhivery','Blue Dart','DTDC','Ekart Logistics','Xpressbees','Amazon Logistics','Shadowfax','Shiprocket'];

// ════════════════════════════════════════════════
//  LOAD & REFRESH
// ════════════════════════════════════════════════
async function loadOrders(){
  allOrders=await dbGetAll('orders');
  allOrders.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  applyFilter();
  updateSidebarCounts();
}

function applyFilter(){
  let list=allOrders;
  if(currentFilter!=='all') list=list.filter(o=>o.status===currentFilter);
  if(currentSearch) list=list.filter(o=>JSON.stringify(o).toLowerCase().includes(currentSearch.toLowerCase()));
  filteredOrders=list;
}

function updateSidebarCounts(){
  const counts={};
  STATUS_FLOW.concat(['cancelled','returned']).forEach(s=>counts[s]=0);
  allOrders.forEach(o=>{if(counts[o.status]!==undefined)counts[o.status]++;});
  ['confirmed','processing','packed','shipped','delivered','cancelled'].forEach(s=>{
    const el=document.getElementById(`nb-${s}`);if(el)el.textContent=counts[s]||0;
  });
  document.getElementById('nb-orders').textContent=allOrders.length;
}

async function saveOrderToDB(order){
  await dbPut('orders',order);
  // also update in allOrders array
  const idx=allOrders.findIndex(o=>o.id===order.id);
  if(idx>=0)allOrders[idx]=order;else allOrders.unshift(order);
  applyFilter();
  updateSidebarCounts();
}

// ════════════════════════════════════════════════
//  RENDER MAIN AREA
// ════════════════════════════════════════════════
function setNav(view){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(`nav-${view}`)?.classList.add('active');
  if(view==='orders')renderOrdersPage();
  else if(view==='analytics')renderAnalytics();
  else if(view==='customers')renderCustomers();
}

function renderOrdersPage(){
  const main=document.getElementById('mainArea');
  const counts={};['all',...STATUS_FLOW,'cancelled'].forEach(s=>counts[s]=s==='all'?allOrders.length:allOrders.filter(o=>o.status===s).length);
  const revenue=allOrders.filter(o=>!['cancelled','returned'].includes(o.status)).reduce((s,o)=>s+o.total,0);
  const pending=allOrders.filter(o=>['confirmed','processing','packed'].includes(o.status)).length;

  main.innerHTML=`
    <div style="margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1 style="font-family:var(--font-h);font-size:26px;font-weight:800;">Order Management</h1>
        <p style="color:var(--sub);font-size:14px;margin-top:3px;">${allOrders.length} total orders · ${pending} need attention</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="tb-btn tb-btn-ghost" onclick="seedDemoOrders()">🌱 Seed Demo Orders</button>
        <button class="tb-btn tb-btn-primary" onclick="toggleViewMode()">
          ${currentView==='table'?'📋 Kanban View':'📊 Table View'}
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card blue ${currentFilter==='all'?'active-filter':''}" onclick="filterByStatus('all')">
        <div class="sc-icon">📦</div>
        <div class="sc-val" style="color:var(--blue)">${counts.all}</div>
        <div class="sc-label">Total Orders</div>
      </div>
      <div class="stat-card yellow ${currentFilter==='confirmed'?'active-filter':''}" onclick="filterByStatus('confirmed')">
        <div class="sc-icon">✅</div>
        <div class="sc-val" style="color:var(--yellow)">${counts.confirmed}</div>
        <div class="sc-label">New · Confirmed</div>
        ${counts.confirmed>0?`<div class="sc-change up">⚡ Needs action</div>`:''}
      </div>
      <div class="stat-card orange ${currentFilter==='processing'?'active-filter':''}" onclick="filterByStatus('processing')">
        <div class="sc-icon">🔄</div>
        <div class="sc-val" style="color:var(--orange)">${counts.processing+counts.packed}</div>
        <div class="sc-label">Processing + Packed</div>
      </div>
      <div class="stat-card green ${currentFilter==='shipped'?'active-filter':''}" onclick="filterByStatus('shipped')">
        <div class="sc-icon">🚚</div>
        <div class="sc-val" style="color:var(--teal)">${counts.shipped}</div>
        <div class="sc-label">In Transit</div>
      </div>
      <div class="stat-card green ${currentFilter==='delivered'?'active-filter':''}" onclick="filterByStatus('delivered')">
        <div class="sc-icon">🎉</div>
        <div class="sc-val" style="color:var(--green)">${counts.delivered}</div>
        <div class="sc-label">Delivered</div>
      </div>
      <div class="stat-card purple">
        <div class="sc-icon">💰</div>
        <div class="sc-val" style="color:var(--indigo)">₹${(revenue/1000).toFixed(1)}K</div>
        <div class="sc-label">Revenue</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="search-box">
        <span style="color:var(--sub2);font-size:16px;">🔍</span>
        <input type="text" placeholder="Search by order ID, customer, product…" value="${currentSearch}" oninput="doSearch(this.value)">
      </div>
      <div class="filter-tabs">
        ${['all','confirmed','processing','packed','shipped','delivered','cancelled'].map(s=>`
          <div class="ftab ${s} ${currentFilter===s?'active':''}" onclick="filterByStatus('${s}')">
            ${STATUS_META[s]?.icon||'📦'} ${s.charAt(0).toUpperCase()+s.slice(1)}
            <span class="tab-count">${counts[s]||0}</span>
          </div>`).join('')}
      </div>
      <select class="sort-sel" onchange="sortOrders(this.value)">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="high">Highest Value</option>
        <option value="low">Lowest Value</option>
      </select>
    </div>

    <!-- BULK BAR -->
    <div class="bulk-bar" id="bulkBar">
      <span class="bulk-count" id="bulkCount">0 selected</span>
      <div class="bulk-btns">
        <button class="bulk-btn" onclick="bulkStatus('processing')">🔄 Processing</button>
        <button class="bulk-btn" onclick="bulkStatus('packed')">📦 Packed</button>
        <button class="bulk-btn" onclick="bulkStatus('shipped')">🚚 Shipped</button>
        <button class="bulk-btn" onclick="bulkStatus('delivered')">✅ Delivered</button>
        <button class="bulk-btn danger" onclick="bulkStatus('cancelled')">❌ Cancel</button>
        <button class="bulk-btn" onclick="clearSelection()">✕ Deselect</button>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="ordersContent"></div>
  `;
  renderOrdersContent();
}

function renderOrdersContent(){
  const el=document.getElementById('ordersContent');
  if(!el)return;
  if(currentView==='kanban')renderKanban(el);
  else renderTable(el);
}

// ════════════════════════════════════════════════
//  KANBAN VIEW
// ════════════════════════════════════════════════
function renderKanban(el){
  const cols=STATUS_FLOW;
  const grouped={};cols.forEach(s=>grouped[s]=[]);
  filteredOrders.filter(o=>STATUS_FLOW.includes(o.status)).forEach(o=>grouped[o.status].push(o));
  el.innerHTML=`<div class="kanban">${cols.map(s=>`
    <div class="kb-col ${s}">
      <div class="kb-col-head">
        <div class="kb-col-title">${STATUS_META[s].icon} ${s.charAt(0).toUpperCase()+s.slice(1)}</div>
        <span class="kb-col-count">${grouped[s].length}</span>
      </div>
      <div class="kb-body">
        ${grouped[s].length===0?`<div class="kb-empty">No orders</div>`:
          grouped[s].map(o=>`
            <div class="kb-card ${o.status}" onclick="openOrder('${o.id}')">
              <div class="kb-card-id">#${o.id}</div>
              <div class="kb-card-name">${o.address?.name||'Customer'}</div>
              <div class="kb-card-meta">
                <span>📅 ${o.date||'—'}</span>
                <span>📦 ${o.items?.length||0} items</span>
              </div>
              <div class="kb-card-price">₹${o.total?.toLocaleString('en-IN')}</div>
            </div>`).join('')}
      </div>
    </div>`).join('')}</div>`;
}

// ════════════════════════════════════════════════
//  TABLE VIEW
// ════════════════════════════════════════════════
function renderTable(el){
  if(!filteredOrders.length){
    el.innerHTML=`<div class="empty-state"><div class="ei">📭</div><h3>No orders found</h3><p>Try changing the filter or refresh the data.</p></div>`;
    return;
  }
  el.innerHTML=`
    <div class="orders-table-wrap">
      <div class="ot-head">
        <div class="ot-head-title">Orders (${filteredOrders.length})</div>
        <div style="font-size:12px;color:var(--sub)">Click any row to manage status</div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this)"></th>
            <th>Order ID</th><th>Customer</th><th>Items</th>
            <th>Total</th><th>Payment</th><th>Date</th>
            <th>Status</th><th>Action</th>
          </tr></thead>
          <tbody>
            ${filteredOrders.map(o=>`
              <tr onclick="openOrder('${o.id}')">
                <td onclick="event.stopPropagation()">
                  <input type="checkbox" class="row-check" value="${o.id}" ${selectedIds.has(o.id)?'checked':''} onchange="toggleRowCheck('${o.id}',this)">
                </td>
                <td class="td-id">#${o.id}</td>
                <td>
                  <div class="td-name">${o.address?.name||'—'}</div>
                  <div class="td-sub">+91 ${o.phone||'—'}</div>
                </td>
                <td>
                  <div>${o.items?.map(i=>i.emoji).join(' ')||'—'}</div>
                  <div class="td-sub">${o.items?.length||0} item${o.items?.length!==1?'s':''}</div>
                </td>
                <td><strong style="color:var(--green)">₹${o.total?.toLocaleString('en-IN')}</strong></td>
                <td class="td-sub" style="font-size:12px;">${(o.payment||'').replace(/[📱💳🏦💵]/g,'').trim()||'—'}</td>
                <td class="td-sub">${o.date||'—'}<br><span style="font-size:10px">${o.time||''}</span></td>
                <td><span class="spill ${o.status}">${STATUS_META[o.status]?.icon||''} ${STATUS_META[o.status]?.label||o.status}</span></td>
                <td onclick="event.stopPropagation()">
                  ${nextStatusBtn(o)}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function nextStatusBtn(o){
  const next=TRANSITIONS[o.status];
  if(!next||!next.length)return`<span style="font-size:12px;color:var(--sub2)">—</span>`;
  const primary=next.find(n=>n.s!=='cancelled')||next[0];
  return`<button onclick="quickStatusChange('${o.id}','${primary.s}')" style="padding:6px 12px;border-radius:6px;border:none;font-family:var(--font-b);font-size:12px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:all .2s;white-space:nowrap;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='var(--blue)'">
    ${primary.icon} ${primary.label.replace('Mark as ','').replace('Start ','')}
  </button>`;
}

// ════════════════════════════════════════════════
//  OPEN ORDER DETAIL MODAL
// ════════════════════════════════════════════════
function openOrder(id){
  const order=allOrders.find(o=>o.id===id);
  if(!order)return;
  openOrderId=id;
  const sm=STATUS_META[order.status];
  document.getElementById('modalTitle').textContent=`Order #${order.id}`;
  const pill=document.getElementById('modalStatusPill');
  pill.className=`spill ${order.status}`;
  pill.textContent=`${sm?.icon||''} ${sm?.label||order.status}`;
  renderModalBody(order);
  document.getElementById('modalMask').classList.add('open');
  document.body.style.overflow='hidden';
}

function changeStatus(orderId,newStatus){
  const order=allOrders.find(o=>o.id===orderId);
  if(!order)return;

  // collect courier info if shipping
  let courierData={};
  if(order.status==='packed'&&newStatus==='shipped'){
    const partner=document.getElementById('courierPartner')?.value;
    const tracking=document.getElementById('trackingNum')?.value?.trim();
    const delDate=document.getElementById('deliveryDate')?.value;
    const weight=document.getElementById('pkgWeight')?.value;
    courierData={courierPartner:partner,trackingNumber:tracking||`AUTO${Date.now().toString().slice(-6)}`,expectedDelivery:delDate,packageWeight:weight};
  }

  const sm=STATUS_META[newStatus];
  pendingAction={type:'statusChange',orderId,newStatus,courierData};

  const isCancelConfirm=newStatus==='cancelled';
  document.getElementById('confIcon').textContent=isCancelConfirm?'⚠️':sm.icon;
  document.getElementById('confTitle').textContent=isCancelConfirm?'Cancel Order?':`Move to ${sm.label}?`;
  document.getElementById('confMsg').innerHTML=isCancelConfirm
    ?`This will permanently cancel order <strong>#${orderId}</strong>. The customer will be notified.`
    :`Update order <strong>#${orderId}</strong> status to <strong>${sm.label}</strong>?${newStatus==='shipped'?`<br><br>📮 Courier: <strong>${courierData.courierPartner}</strong><br>Tracking: <strong>${courierData.trackingNumber}</strong>`:''}`;
  const yesBtn=document.getElementById('confYes');
  yesBtn.textContent=isCancelConfirm?'Yes, Cancel Order':'Yes, Update Status';
  yesBtn.style.background=isCancelConfirm?'var(--red)':'var(--blue)';
  yesBtn.style.color='#fff';
  document.getElementById('confirmOverlay').classList.add('open');
}

function quickStatusChange(orderId,newStatus){
  const order=allOrders.find(o=>o.id===orderId);
  if(!order)return;
  if(order.status==='packed'&&newStatus==='shipped'){openOrder(orderId);return;} // needs courier info
  changeStatus(orderId,newStatus);
}

async function doConfirm(){
  closeConfirm();
  if(!pendingAction)return;
  if(pendingAction.type==='statusChange'){
    await applyStatusChange(pendingAction.orderId,pendingAction.newStatus,pendingAction.courierData);
  }else if(pendingAction.type==='bulkStatus'){
    for(const id of pendingAction.ids)await applyStatusChange(id,pendingAction.status,{});
    clearSelection();
  }
  pendingAction=null;
}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('open');}

async function applyStatusChange(orderId,newStatus,courierData={}){
  const order=allOrders.find(o=>o.id===orderId);
  if(!order)return;
  const oldStatus=order.status;
  const now=new Date();
  const timeStr=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' · '+now.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  const actor='Seller Dashboard';

  // update status
  order.status=newStatus;

  // apply courier data
  if(courierData.courierPartner)Object.assign(order,courierData);

  // update tracking steps
  const stepMap={
    confirmed:0,processing:1,packed:2,shipped:3,delivered:4
  };
  if(order.trackingSteps){
    const newIdx=stepMap[newStatus];
    if(newIdx!==undefined){
      order.trackingSteps.forEach((s,i)=>{
        if(i<=newIdx){s.done=true;s.active=false;}
        else if(i===newIdx+1){s.done=false;s.active=true;}
        else{s.done=false;s.active=false;}
      });
      // update time on the reached step
      if(order.trackingSteps[newIdx]){
        order.trackingSteps[newIdx].time=timeStr;
        order.trackingSteps[newIdx].actor=actor;
        if(newIdx===3&&courierData.trackingNumber){
          order.trackingSteps[3].sub=`Handed to ${courierData.courierPartner} · Tracking: ${courierData.trackingNumber}`;
        }
      }
    }
    if(newStatus==='cancelled'){
      order.trackingSteps.forEach(s=>{s.done=false;s.active=false;});
      // add cancellation step
      if(!order.trackingSteps.find(s=>s.label==='Cancelled')){
        order.trackingSteps.push({label:'Cancelled',sub:'Order was cancelled by seller',time:timeStr,actor,done:true,active:false});
      }
    }
  }

  // persist to IndexedDB
  await saveOrderToDB(order);

  // refresh UI
  renderOrdersPage();
  if(openOrderId===orderId){
    setTimeout(()=>{
      const sm=STATUS_META[newStatus];
      const pill=document.getElementById('modalStatusPill');
      if(pill){pill.className=`spill ${newStatus}`;pill.textContent=`${sm?.icon||''} ${sm?.label||newStatus}`;}
      renderModalBody(order);
    },100);
  }

  const sm=STATUS_META[newStatus];
  showToast('success',sm.icon,`Order #${orderId} → ${sm.label}`);
}

function sortOrders(val){
  if(val==='newest')filteredOrders.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else if(val==='oldest')filteredOrders.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  else if(val==='high')filteredOrders.sort((a,b)=>b.total-a.total);
  else if(val==='low')filteredOrders.sort((a,b)=>a.total-b.total);
  renderOrdersContent();
}

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
let toastTimer;
function showToast(type,icon,msg){
  const el=document.getElementById('toastEl');
  document.getElementById('toastIcon').textContent=icon;
  document.getElementById('toastMsg').textContent=msg;
  el.style.borderLeft=`4px solid ${type==='success'?'var(--green)':type==='error'?'var(--red)':'var(--blue)'}`;
  el.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
}

async function refreshAll(){

  renderOrdersPage();

}

//  BOOT
// ════════════════════════════════════════════════
async function boot(){
  try{
    await initDB();
    document.getElementById('dbDot').className='db-dot';
    document.getElementById('dbLabel').textContent='ShopKartDB · Live';
    await loadOrders();
    renderOrdersPage();
    showToast('success','✅',`Connected — ${allOrders.length} orders loaded`);
  }catch(err){
    document.getElementById('dbDot').className='db-dot error';
    document.getElementById('dbLabel').textContent='DB Error';
    document.getElementById('mainArea').innerHTML=`<div class="empty-state"><div class="ei">❌</div><h3>Database Error</h3><p>${err.message}</p></div>`;
  }
}
boot();
